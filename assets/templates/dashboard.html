<!DOCTYPE html>
<html>
<head>
<title>h5p-dev {lang_dashboard}</title>
<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="/{assets}/styles/reset.css">
<link rel="stylesheet" type="text/css" href="/{assets}/styles/style.css">
<script type="text/javascript" src="/{assets}/scripts/dashboard.js"></script>
<script type="text/javascript">
  const runner = new dashboard({
    self: 'runner',
    api: '{api}',
    space: {spaceJson},
    ids: {
      newContentButton: 'newContentButton',
      newContent: 'newContent',
      importContentButton: 'importContentButton',
      importContent: 'importContent',
      newSpaceButton: 'newSpaceButton',
      newSpaceButtonLabel: 'newSpaceButtonLabel',
      newSpace: 'newSpace',
      spaceName: 'spaceName',
      sectionsTitle: 'sectionsTitle',
      contentTypes: 'contentTypes',
      createFolder: 'createFolder',
      importFolder: 'importFolder',
      archive: 'archive',
      status: 'status',
      breadcrumb: 'breadcrumb',
      spaces: 'spaces',
      spacesSection: 'spacesSection',
      content: 'content',
      pagination: 'pagination',
      languages: 'languages',
      spaceItemTemplate: 'spaceItemTemplate',
      contentItemTemplate: 'contentItemTemplate',
      paginationLinkTemplate: 'paginationLinkTemplate',
      modal: 'dashModal',
      modalTitle: 'dashModalTitle',
      modalHint: 'dashModalHint',
      modalBody: 'dashModalBody',
      modalCancel: 'dashModalCancel',
      modalOk: 'dashModalOk'
    },
    classes: {
      hidden: 'hidden'
    },
    language: "{language}",
    languages: {languages},
    sectionButtonLabel: "{sectionButtonLabel}",
    sectionsTitle: "{sectionsTitle}"
  });
  runner.init();
</script>
</head>
<body>
  <div class="sticky">
    <div class="hidden" id="status">{status}</div>
    <div class="menu-holder">
      <div class="menu">
        <div class="button new" id="newContentButton" onclick="runner.toggleNewContent()">
          <span class="button-label">{lang_new}</span>
        </div>
        <div class="button import" id="importContentButton" onclick="runner.toggleImportContent()">
          <span class="button-label">{lang_import}</span>
        </div>
        <div class="button new-space" id="newSpaceButton" onclick="runner.toggleNewSpace()">
          <span class="button-label" id="newSpaceButtonLabel">{sectionButtonLabel}</span>
        </div>
        <div class="languages">
          {lang_language}
          <select id="languages" class="selector" onchange="runner.changeLanguage()">
            <option value="{value}"{selected}>{name}</option>
          </select>
        </div>
        <div id="newContent" class="hidden inline">
          <div class="center-content">
            <select id="contentTypes" class="selector">
              <option value="{value}">{name}</option>
            </select>
            <input type="text" class="input" id="createFolder" placeholder="{lang_TypeContentTitle}">
            <div class="button" onclick="runner.create()">{lang_create}</div>
          </div>
        </div>
        <div id="importContent" class="hidden inline">
          <div class="center-content">
            <input type="text" class="input" id="importFolder" placeholder="{lang_TypeContentTitle}">
            <input type="file" class="input" id="archive" accept=".h5p">
            <div class="button" onclick="runner.import()">{lang_import}</div>
          </div>
        </div>
        <div id="newSpace" class="hidden inline">
          <div class="center-content">
            <input type="text" class="input" id="spaceName" placeholder="Nombre">
            <div class="button" onclick="runner.createSpace()">Crear</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="dashboard-layout">
    <aside id="spacesSection" class="spaces-sidebar" aria-label="Navegación de secciones">
      <h2 class="section-title" id="sectionsTitle">{sectionsTitle}</h2>
      <div class="spaces" id="spaces"></div>
    </aside>
    <div class="holder">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta">
        <a href="/dashboard">{breadcrumbRootLabel}</a>
      </nav>
      <h2 class="section-title">Actividades</h2>
      <div class="content" id="content"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
  <template id="spaceItemTemplate">
    <div class="space-item">
      <a class="space-link" href="{href}">{name}</a>
      <div class="space-actions">
        <div class="button transition move tooltip" onclick="runner.moveSpace('{folderUrl}', '{name}')">
          <span class="tooltiptext">Mover</span>
        </div>
        <div class="button transition rename tooltip" onclick="runner.renameSpace('{folderUrl}', '{name}')">
          <span class="tooltiptext">{lang_Rename}</span>
        </div>
        <div class="button transition delete tooltip" onclick="runner.removeSpace('{folderUrl}', '{name}')">
          <span class="tooltiptext">{lang_Delete}</span>
        </div>
      </div>
    </div>
  </template>
  <template id="contentItemTemplate">
    <div class="item">
      <div class="itemIcon"><img src="{icon}" /></div>
      <div class="itemTitle"><a href="/view/{library}/{folderUrl}">{title}</a>
        <div class="itemPath">{library}</div>
      </div>
      <div class="itemLinks">
        <a class="view transition tooltip" href="/view/{library}/{folderUrl}">
          <span class="tooltiptext">{lang_View}</span>
        </a>
        <a class="edit transition tooltip" href="/edit/{library}/{folderUrl}">
          <span class="tooltiptext">{lang_Edit}</span>
        </a>
        <div class="button transition copy tooltip" onclick="runner.copy('{folderUrl}')">
          <span class="tooltiptext">{lang_Copy}</span>
        </div>
        <div class="button transition move tooltip" onclick="runner.move('{folderUrl}')">
          <span class="tooltiptext">Mover</span>
        </div>
        <div class="button transition rename tooltip" onclick="runner.rename('{folderUrl}', '{folderBase}')">
          <span class="tooltiptext">{lang_Rename}</span>
        </div>
        <div class="button transition delete tooltip" onclick="runner.remove('{folderUrl}')">
          <span class="tooltiptext">{lang_Delete}</span>
        </div>
      </div>
    </div>
  </template>
  <template id="paginationLinkTemplate">
    <div class="button{selected}" onclick="{onclick}">{page}</div>
  </template>
  <div id="dashModal" class="dash-modal hidden" aria-hidden="true">
    <div class="dash-modal-backdrop" data-modal-dismiss="1"></div>
    <div class="dash-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="dashModalTitle">
      <h3 id="dashModalTitle" class="dash-modal-title"></h3>
      <p id="dashModalHint" class="dash-modal-hint hidden"></p>
      <div id="dashModalBody" class="dash-modal-body"></div>
      <div class="dash-modal-actions">
        <button type="button" class="button" id="dashModalCancel">Cancelar</button>
        <button type="button" class="button dash-modal-primary" id="dashModalOk">Aceptar</button>
      </div>
    </div>
  </div>
</body>
</html>
